<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>Check-In QR Code — {{ event.title }}</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 14px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #070a12; color: #f8fafc;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card {
      background: #111827; border: 1px solid rgba(212,175,55,0.35);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #f5d77a; }
    .input {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid #334155; background: #0b101d; color: #fff; font-size: 15px;
    }
    .btn {
      padding: 12px 16px; border-radius: 10px; border: 0; font-weight: 800; cursor: pointer; font-size: 14px;
    }
    .btn-gold { background: linear-gradient(135deg, #d4af37, #b58d22); color: #070a12; }
    .btn-ghost { background: #1e293b; color: #fff; text-decoration: none; display: inline-block; }
    .res-ok { background: rgba(34,197,94,0.16); border: 2px solid #22c55e; border-radius: 14px; padding: 16px; }
    .res-warn { background: rgba(245,158,11,0.16); border: 2px solid #f59e0b; border-radius: 14px; padding: 16px; }
    .res-err { background: rgba(239,68,68,0.16); border: 2px solid #ef4444; border-radius: 14px; padding: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <a class="btn btn-ghost" href="/">← CRM</a>
      <span style="font-size:13px;color:#9ca3af;">Présents : <strong style="color:#4ade80;" id="ciCount">{{ event.checked_in_count }}</strong> / {{ event.registered_count }}</span>
    </div>

    <div class="card">
      <h1>📱 Scanner Check-In Jour J</h1>
      <div style="font-size:13px;color:#cbd5e1;margin-bottom:12px;">{{ event.title }} · {{ event.location }}</div>
      <div id="qrReader" style="width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input class="input" id="manualCode" placeholder="Ou saisissez le code (ex: VIP-1127-A1B2C3)" />
        <button class="btn btn-gold" id="manualBtn">Valider</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1;cursor:pointer;">
        <input type="checkbox" id="autoPayChk" />
        <span>Valider le paiement (10 000 FCFA) + activer la clé 7 jours automatiquement au scan</span>
      </label>
    </div>

    <div id="scanResult"></div>
  </div>

  <script>
    const csrf = document.querySelector('meta[name="csrf-token"]')?.content || "";
    async function verifyTicket(code) {
      const box = document.getElementById("scanResult");
      if (!code.trim()) return;
      try {
        const res = await fetch("/api/events/checkin", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf },
          body: JSON.stringify({
            ticket_code: code.trim(),
            auto_confirm_payment: document.getElementById("autoPayChk").checked,
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          box.innerHTML = `<div class="res-err"><strong>❌ BILLET INVALIDE</strong><div style="margin-top:4px;">${data.error || "Introuvable"}</div></div>`;
          return;
        }
        const r = data.registration;
        const cls = data.already_checked_in ? "res-warn" : "res-ok";
        const head = data.already_checked_in ? "⚠️ DÉJÀ SCANNÉ (DOUBLON)" : "✅ ACCÈS VIP VALIDÉ !";
        box.innerHTML = `
          <div class="${cls}">
            <div style="font-size:18px;font-weight:900;">${head}</div>
            <div style="margin-top:8px;font-size:15px;"><strong>${r.full_name}</strong> (${r.ticket_code})</div>
            <div style="margin-top:4px;font-size:14px;">👕 T-Shirt à remettre : <strong style="color:#f5d77a;">TAILLE ${r.tshirt_size}</strong></div>
            <div style="margin-top:4px;font-size:14px;">💳 Paiement : <strong>${r.payment_status === "paid" ? "PAYÉ ✅" : "EN ATTENTE ⏳ (10 000 FCFA)"}</strong></div>
            ${r.trial_license_key ? `<div style="margin-top:6px;font-size:12px;color:#4ade80;">🔑 Clé 7 jours activée & envoyée sur WhatsApp</div>` : ""}
          </div>
        `;
      } catch (e) {
        box.innerHTML = `<div class="res-err">Erreur réseau : ${e.message}</div>`;
      }
    }

    document.getElementById("manualBtn").addEventListener("click", () => {
      verifyTicket(document.getElementById("manualCode").value);
    });

    if (typeof Html5Qrcode !== "undefined") {
      const scanner = new Html5Qrcode("qrReader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 8, qrbox: { width: 220, height: 220 } },
        (decoded) => {
          document.getElementById("manualCode").value = decoded;
          verifyTicket(decoded);
        },
        () => {}
      ).catch(() => {});
    }
  </script>
</body>
</html>
