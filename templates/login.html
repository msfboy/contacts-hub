<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — ContactsHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .icon {
      width: 42px; height: 42px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; font-weight: 700; font-size: 22px;
      display: grid; place-items: center;
    }
    h1 { margin: 0; font-size: 20px; color: #0f172a; }
    p { margin: 2px 0 0; font-size: 13px; color: #64748b; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #475569; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px #eef2ff; }
    button {
      width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 9px;
      background: #4f46e5; color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .err {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="icon">@</div>
      <div>
        <h1>ContactsHub</h1>
        <p>Connexion à votre espace sécurisé</p>
      </div>
    </div>
    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <label>Identifiant</label>
      <input type="text" name="username" required autofocus placeholder="admin" />
      <label>Mot de passe</label>
      <input type="password" name="password" required placeholder="••••••••" />
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
